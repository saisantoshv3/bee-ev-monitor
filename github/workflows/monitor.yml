name: BEE EV Charging Data Monitor

on:
  schedule:
    # Every Monday and Thursday at 9:00 AM IST (3:30 AM UTC)
    # BEE updates this data infrequently — twice a week is plenty
    - cron: "30 3 * * 1,4"

  # Trigger manually from the Actions tab anytime
  workflow_dispatch:

jobs:
  check-bee-ev-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # To commit updated state/last_seen.json back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run monitor
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/last_seen.json
          git diff --staged --quiet || git commit -m "chore: update BEE monitor state [skip ci]"
          git push
